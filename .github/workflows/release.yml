name: RELEASE

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace
    runs-on: ubuntu-latest
    steps:
      # v6 (d23441a48e516b6c34aea4fa41551a30e30af803)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: npm install -g @anthropic-ai/claude-code@2.1.296
      - run: claude plugin validate . --strict

  github_release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v6 (d23441a48e516b6c34aea4fa41551a30e30af803)
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v ver="$VERSION" '
            $0 == "## [" ver "]" || index($0, "## [" ver "] ") == 1 { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        # v3 (efb35369e0ad2afab669f228072c1b0d510eae64)
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
